<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Link2Stream Local</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main>
    <header>
      <h1>Link2Stream Local</h1>
      <p class="muted" id="env-line"></p>
    </header>

    <section class="card" id="r2-settings">
      <div class="row between">
        <h2>R2 settings</h2>
        <span id="r2-status" class="status Queued">checking...</span>
      </div>
      <p class="muted">Keys are sent only to the local backend and saved to .env (never shown back here).</p>
      <div class="grid">
        <input id="r2-account" type="text" placeholder="R2 Account ID" autocomplete="off" />
        <input id="r2-access-key" type="password" placeholder="R2 Access Key ID" autocomplete="off" />
        <input id="r2-secret" type="password" placeholder="R2 Secret Access Key" autocomplete="off" />
      </div>
      <p class="muted">Bucket: family-share (fixed)</p>
      <div class="row">
        <button id="r2-save">Save R2 settings</button>
        <span id="r2-save-msg" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <div class="row between">
        <h2>Input files</h2>
        <button id="rescan" class="secondary">Rescan</button>
      </div>
      <div id="files" class="muted">Scanning...</div>
    </section>

    <section class="card">
      <h2>Output</h2>
      <label class="radio">
        <input type="radio" name="profile" value="smaller-1080p" />
        Smaller 1080p <span class="muted">(same resolution, ~3 Mbps)</span>
      </label>
      <label class="radio">
        <input type="radio" name="profile" value="720p" checked />
        720p <span class="muted">(1280x720, ~2 Mbps)</span>
      </label>
      <div class="row">
        <button id="process" disabled>Process + Upload</button>
        <span id="selection" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2>Jobs</h2>
      <div id="jobs" class="muted">No jobs yet.</div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
